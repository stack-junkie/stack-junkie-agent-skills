<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project delivery review</title>
<style>
:root{--paper:#f7f6f3;--ink:#242923;--muted:#64685f;--line:#eaeaea;--green:#edf3ec;--amber:#fbf3db;--red:#fdebec}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Segoe UI","Helvetica Neue",sans-serif}button,select{font:inherit}button,a,select{touch-action:manipulation}a{color:inherit;text-underline-offset:4px}button{border:1px solid var(--line);padding:10px 15px;background:#fff;border-radius:5px;cursor:pointer}button:hover{background:#edf0e9}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #63795f;outline-offset:3px}
header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff}.brand{font-weight:650;letter-spacing:-.03em;font-size:19px}.overline,.meta{font:11px/1.5 Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.switch{display:flex;gap:6px}.switch button[aria-pressed=true]{background:var(--ink);color:#fff}main{max-width:1280px;margin:auto;padding:0 42px 70px}nav{display:flex;gap:24px;padding:20px 0;font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}nav a{text-decoration:none}.hero{padding:60px 0 38px;display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:70px}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.035em}h1{font-size:clamp(38px,5vw,65px);line-height:1.04;margin:18px 0 24px}h2{font-size:32px;line-height:1.15;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}p{margin:0 0 14px}.lede{font-size:18px;max-width:700px;color:#555d52}.aside{border-left:1px solid #d5d9ce;padding-left:26px;align-self:end}.tag{display:inline-block;background:var(--amber);color:#795300;padding:4px 9px;font:11px/1.5 Consolas,monospace;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}.tag.pass,.tag.done{background:var(--green);color:#346538}.tag.fail,.tag.blocked{background:var(--red);color:#9f2f2d}.tag.unknown,.tag.ready{background:#eceee9;color:#58604e}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}.metric{padding:22px;background:#fff}.metric strong{display:block;font:30px/1.2 Georgia,serif;margin:8px 0}.metric small{color:var(--muted)}section{padding:46px 0;border-bottom:1px solid var(--line);scroll-margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:22px}.section-head p{color:var(--muted);max-width:700px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px}.list{padding-left:20px;margin:0}.list li{margin-bottom:10px}.muted{color:var(--muted)}.board{display:grid;grid-template-columns:repeat(5,minmax(185px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}.column{background:#eeeee9;border-radius:8px;padding:13px;min-height:190px}.coltitle{font-size:12px;font-weight:650;display:flex;justify-content:space-between;margin:0 0 15px}.work{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px;margin-bottom:10px}.work h3{font-size:14px;margin:7px 0}.work p{font-size:12px;margin:6px 0;color:var(--muted)}.work a{font-size:12px}.empty{font-size:12px;color:var(--muted);padding:18px 0}select{padding:7px 10px;background:white;border:1px solid var(--line);border-radius:4px;max-width:180px}.timeline{overflow:auto}.timeline-inner{min-width:680px}.axis{display:flex;justify-content:space-between;margin:0 0 12px 210px;font:11px Consolas,monospace;color:var(--muted)}.time-row{display:grid;grid-template-columns:195px 1fr;gap:15px;align-items:center;margin:14px 0}.time-label{font-size:12px}.track{height:30px;background:repeating-linear-gradient(90deg,#eeeee8 0,#eeeee8 1px,transparent 1px,transparent 25%);border-bottom:1px solid var(--line);position:relative}.bar{position:absolute;top:3px;height:22px;background:#dbe5d5;border-radius:3px;min-width:3px}.time-row:nth-child(even) .bar{background:#e8e1d2}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;vertical-align:top;padding:13px 10px;border-bottom:1px solid var(--line)}th{font:11px Consolas,monospace;text-transform:uppercase;color:var(--muted)}td:first-child,th:first-child{padding-left:0}.table-wrap{overflow:auto}td small{display:block;color:var(--muted);margin-top:4px}.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.evidence-grid img,.evidence-grid video{width:100%;height:auto;max-height:380px;object-fit:contain;background:#f0f0eb;border-radius:4px}.evidence-grid figcaption{margin-top:10px;font-size:13px}.evidence-grid figure{margin:0}.callout{border-left:3px solid #9caa91;padding:12px 18px;background:#eeeee7;color:#4a5245}.decision{border-bottom:1px solid var(--line);padding:16px 0}.decision:first-child{padding-top:0}.decision:last-child{border:0}.decision strong{display:block}pre{white-space:pre-wrap;word-break:break-word;background:#f1f1ed;border:1px solid var(--line);padding:20px;font:12px/1.7 Consolas,monospace;border-radius:6px;max-height:420px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{font-size:12px;color:var(--muted);padding-top:24px}.reveal{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}main{padding:0 20px 40px}.hero{grid-template-columns:1fr;gap:22px;padding-top:32px}.aside{align-self:start}.metrics{grid-template-columns:repeat(2,1fr)}.two,.evidence-grid{grid-template-columns:1fr}.section-head{flex-direction:column}section{padding:32px 0}.switch{flex-wrap:wrap}}@media print{button,select,nav{display:none}body{background:white}main{max-width:none;padding:0}.hero{padding-top:20px}section{break-inside:avoid}.board{display:block}.column{display:inline-block;width:30%;vertical-align:top}.metrics{grid-template-columns:repeat(4,1fr)}pre{max-height:none}.reveal{animation:none}}
</style></head><body>
<header><div><div class="overline">Project Team / 0.1.2</div><div class="brand"><span id="project-name">Project</span> <span class="muted">/ Delivery review</span></div></div><div class="switch" id="switch" aria-label="Select work period"></div></header>
<main><nav><a href="#overview">Overview</a><a href="#work">Work & schedule</a><a href="#acceptance">Acceptance</a><a href="#team">Team review</a><a href="#evidence">Evidence</a><a href="#launch">Launch prompt</a></nav><div id="content"></div><footer id="footer"></footer></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('report-data').textContent);let active=0;document.getElementById('project-name').textContent=data.project||'Project';document.title=(data.project||'Project')+' | Delivery review';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>typeof u==='string'&&!/^(javascript|data|vbscript):/i.test(u)&&!u.startsWith('//')?u:'#';
const tag=s=>'<span class="tag '+esc(String(s).toLowerCase())+'">'+esc(s)+'</span>';
const bullets=xs=>'<ul class="list">'+xs.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
function render(){const r=data.runs[active];document.getElementById('switch').innerHTML=data.runs.map((x,i)=>'<button data-run="'+i+'" aria-pressed="'+(i===active)+'">'+esc(x.label)+'</button>').join('');
document.getElementById('content').innerHTML=
'<div class="hero reveal" id="overview"><div><div class="overline">'+esc(r.id)+' / '+esc(r.phase)+'</div><h1>'+esc(r.title)+'</h1><p class="lede">'+esc(r.outcome)+'</p></div><aside class="aside">'+tag(r.status)+'<p style="margin-top:14px">'+esc(r.executive)+'</p><div class="meta">Snapshot '+esc(data.updated)+'</div><p class="muted" style="font-size:12px">Snapshot report. No background monitoring.</p></aside></div>'+
'<div class="metrics">'+r.metrics.map(m=>'<div class="metric"><div class="overline">'+esc(m.label)+'</div><strong>'+esc(m.value)+'</strong><small>'+esc(m.note)+'</small></div>').join('')+'</div>'+
'<section class="two"><div><h2>Why this assignment</h2><p>'+esc(r.why)+'</p><div class="callout">'+esc(r.scopeNote)+'</div></div><div class="box"><h3>What you should receive</h3>'+bullets(r.deliverables)+'</div></section>'+
'<section id="work"><div class="section-head"><div><h2>Work & dependencies</h2><p>One set of work items powers this board and schedule. Proposed assignments remain unverified until a team accepts them.</p></div><label>Show status <select id="filter"><option value="all">All work</option>'+['Ready','In progress','Review','Blocked','Done'].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label></div><div id="board" class="board"></div>'+(r.showSchedule===false?'<p class="muted" style="margin-top:25px">No implementation time budget or measured work schedule is assigned in this report.</p>':'<h3 style="margin-top:25px">Relative schedule / '+esc(r.scheduleLabel)+'</h3><p class="muted">Bars are proposed work windows in minutes from kickoff, not measured work or delivery guarantees.</p><div class="timeline"><div class="timeline-inner"><div class="axis"><span>0</span><span>'+r.ceiling/4+'</span><span>'+r.ceiling/2+'</span><span>'+r.ceiling*3/4+'</span><span>'+r.ceiling+' min</span></div>'+r.tasks.map(t=>'<div class="time-row"><div class="time-label">'+esc(t.id+' · '+t.short)+'</div><div class="track"><div class="bar" title="'+esc(t.start+' to '+t.end+' minutes. Depends on '+(t.depends.join(', ')||'none'))+'" style="left:'+Math.max(0,Math.min(100,t.start/r.ceiling*100))+'%;width:'+Math.max(0,Math.min(100,(t.end-t.start)/r.ceiling*100))+'%"></div></div></div>').join('')+'</div></div>')+'</section>'+
'<section id="acceptance"><div class="section-head"><div><h2>Acceptance, without guesswork</h2><p>Passing checks must link to the actual candidate and observed behavior. No percentage is inferred from task counts.</p></div></div><div class="table-wrap"><table><thead><tr><th>Required behavior</th><th>Result</th><th>Evidence or next check</th></tr></thead><tbody>'+r.acceptance.map(a=>'<tr><td>'+esc(a.requirement)+'</td><td>'+tag(a.status)+'</td><td>'+esc(a.note)+(a.href?'<br><a href="'+esc(safe(a.href))+'">Open evidence</a>':'')+'</td></tr>').join('')+'</tbody></table></div></section>'+
'<section id="team"><div class="section-head"><div><h2>The team, and its judgment</h2><p>'+esc(r.teamNote)+'</p></div></div><div class="two"><div class="box"><h3>Responsibilities</h3><div class="table-wrap"><table><thead><tr><th>Role</th><th>Assignment / identity</th></tr></thead><tbody>'+r.team.map(t=>'<tr><td>'+esc(t.role)+'</td><td>'+esc(t.job)+'<small>'+esc(t.identity||'Not assigned')+'</small></td></tr>').join('')+'</tbody></table></div></div><div class="box"><h3>Deputy review & decisions</h3>'+r.decisions.map(d=>'<div class="decision"><strong>'+esc(d.title)+'</strong>'+tag(d.status)+'<p style="margin-top:10px">'+esc(d.detail)+'</p><small class="muted">'+esc(d.response)+'</small></div>').join('')+'</div></div><h3 style="margin-top:25px">Standup / meaningful changes</h3>'+bullets(r.standups)+'<div class="two" style="margin-top:25px"><div class="box"><h3>Risks & owner decisions</h3>'+bullets(r.risks)+'</div><div class="box"><h3>How we will assess the run</h3>'+bullets(r.review)+'</div></div></section>'+
'<section id="evidence"><div class="section-head"><div><h2>See the actual result</h2><p>Runtime media, build instructions and saves belong beside the report. Source notes are not gameplay evidence.</p></div></div>'+
(r.evidence.length?'<div class="evidence-grid">'+r.evidence.map(e=>'<figure class="box">'+(e.kind==='image'?'<img loading="lazy" src="'+esc(safe(e.href))+'" alt="'+esc(e.caption)+'">':e.kind==='video'?'<video controls muted preload="metadata" src="'+esc(safe(e.href))+'"></video><p class="media-status muted" role="status" aria-live="polite" style="font-size:12px;margin-top:8px"></p>':'<a href="'+esc(safe(e.href))+'">'+esc(e.title)+'</a>')+'<figcaption>'+esc(e.caption)+'</figcaption></figure>').join('')+'</div>':'<div class="box"><h3>No run evidence yet</h3><p class="muted">This is the prepared assignment. The executing team must add the media required by the assignment, observed results, launch instructions and the preserved save before claiming success. Motion-dependent claims require inspected video with timestamped evidence.</p></div>')+
'<details style="margin-top:20px"><summary>Source notes and freshness</summary>'+bullets(r.sources)+'</details></section>'+
'<section id="launch"><div class="section-head"><div><h2>Start in a fresh task</h2><p>'+esc(r.launchNote)+'</p></div><div class="actions"><button id="copy">Copy prompt</button><button id="export">Export report data</button><button id="print">Print report</button></div></div><pre id="prompt" tabindex="0">'+esc(r.prompt)+'</pre><p role="status" id="message" aria-live="polite"></p></section>';
document.getElementById('footer').textContent=data.footer;
document.querySelectorAll('#evidence video').forEach(video=>video.addEventListener('error',()=>{const status=video.parentElement.querySelector('.media-status');if(status)status.textContent='Video playback error: '+(video.error?.message||('media error '+(video.error?.code||'unknown')))+'. Use the retained file link to inspect the artifact.'}));
document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.run);render()});document.getElementById('filter').onchange=renderBoard;renderBoard();
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(r.prompt);document.getElementById('message').textContent='Prompt copied.'}catch{const range=document.createRange();range.selectNodeContents(document.getElementById('prompt'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.getElementById('message').textContent='Prompt selected. Press Ctrl+C to copy.'}};
document.getElementById('print').onclick=()=>window.print();
document.getElementById('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='report-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
}
function renderBoard(){const r=data.runs[active],filter=document.getElementById('filter').value;document.getElementById('board').innerHTML=['Ready','In progress','Review','Blocked','Done'].filter(s=>filter==='all'||s===filter).map(s=>{const items=r.tasks.filter(t=>t.status===s);return '<div class="column"><div class="coltitle">'+esc(s)+' <span>'+items.length+'</span></div>'+items.map(t=>'<article class="work"><div class="meta">'+esc(t.id)+' / '+esc(t.owner)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.result)+'</p><p>Depends on '+esc(t.depends.join(', ')||'none')+'</p></article>').join('')+(!items.length?'<div class="empty">No items in this state.</div>':'')+'</div>'}).join('')}
const highlightStops=new WeakMap();
async function playHighlight(video,start,end){
  const status=video.parentElement.querySelector('.media-status');
  const requested='Requested '+start+' s'+(end===null?'':' to '+end+' s')+'. ';
  const say=text=>{if(status)status.textContent=requested+text};
  document.querySelectorAll('#evidence video').forEach(other=>other.pause());
  const oldStop=highlightStops.get(video);
  if(oldStop){video.removeEventListener('timeupdate',oldStop);highlightStops.delete(video)}
  video.scrollIntoView({block:'center'});
  say('Loading video metadata.');
  try{
    if(video.readyState<1)await new Promise((resolve,reject)=>{
      const cleanup=()=>{clearTimeout(timer);video.removeEventListener('loadedmetadata',loaded);video.removeEventListener('error',failed)};
      const loaded=()=>{cleanup();resolve()};
      const failed=()=>{cleanup();reject(new Error('Video could not be loaded.'))};
      const timer=setTimeout(()=>{cleanup();reject(new Error('Video metadata did not load within 10 seconds.'))},10000);
      video.addEventListener('loadedmetadata',loaded);video.addEventListener('error',failed);video.load();
    });
    if(Number.isFinite(video.duration)&&(start>=video.duration||(end!==null&&end>video.duration)))throw new Error('Requested timestamp is outside this video.');
    video.currentTime=start;
    if(end!==null){
      const stop=()=>{if(video.currentTime>=end){video.pause();video.currentTime=end;video.removeEventListener('timeupdate',stop);highlightStops.delete(video);say('Paused at the requested end '+end+' s.')}};
      highlightStops.set(video,stop);video.addEventListener('timeupdate',stop);
    }
    await video.play();
    say('Playing from '+video.currentTime.toFixed(3)+' s'+(end===null?'.':'; will pause at '+end+' s.'));
  }catch(error){
    const stop=highlightStops.get(video);if(stop){video.removeEventListener('timeupdate',stop);highlightStops.delete(video)}
    say('Playback error: '+error.message+' Use the native video controls or open the link directly.');
  }
}
document.querySelector('nav').addEventListener('click',event=>{
  const link=event.target.closest('a[href^="#"]');
  if(!link||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
  const section=document.getElementById(link.getAttribute('href').slice(1));
  if(section){event.preventDefault();section.scrollIntoView({block:'start'})}
});
document.getElementById('content').addEventListener('click',event=>{
  const link=event.target.closest('a');
  if(!link||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
  const match=(link.getAttribute('href')||'').match(/^(.+\.webm)#t=(\d+(?:\.\d+)?)(?:,(\d+(?:\.\d+)?))?$/i);
  if(!match)return;
  const video=Array.from(document.querySelectorAll('#evidence video')).find(v=>(v.getAttribute('src')||'').split('#')[0]===match[1]);
  const start=Number(match[2]),end=match[3]===undefined?null:Number(match[3]);
  if(!video||!Number.isFinite(start)||(end!==null&&(!Number.isFinite(end)||end<=start)))return;
  event.preventDefault();playHighlight(video,start,end);
});

render();
</script></body></html>
